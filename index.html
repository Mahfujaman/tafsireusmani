<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>তাফসীরে উসমানী</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Amiri+Quran&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #f8f4ec;
  --surface:    #ffffff;
  --surface2:   #f2ead8;
  --border:     #ddd0b0;
  --gold:       #8b6914;
  --gold-light: #c49a2a;
  --gold-pale:  #fdf3d8;
  --green:      #1a5c3a;
  --green-light:#2a7a50;
  --green-pale: #e8f5ee;
  --ink:        #1a1208;
  --muted:      #7a6b4e;
  --red:        #8b2020;
  --sidebar-w:  280px;
  --header-h:   58px;
}
body.dark {
  --bg:         #0e0c08;
  --surface:    #1a1610;
  --surface2:   #221e16;
  --border:     #3a3020;
  --gold:       #d4a84b;
  --gold-light: #e8c070;
  --gold-pale:  #1e1800;
  --green:      #4ab888;
  --green-light:#60d0a0;
  --green-pale: #0a1810;
  --ink:        #e8dcc8;
  --muted:      #9a8a6a;
  --red:        #e05050;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Serif Bengali',serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .3s,color .3s;}

/* ===== HEADER ===== */
#header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:linear-gradient(135deg,#1a1000,#2d1f00,#0a2010);
  display:flex;align-items:center;gap:12px;padding:0 16px;
  z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.4);
}
#menuBtn{background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;padding:4px 8px;border-radius:6px;transition:background .2s;}
#menuBtn:hover{background:rgba(255,255,255,.1);}
.header-title{flex:1;}
.header-title h1{font-size:1rem;font-weight:700;color:#fff;}
.header-title p{font-size:.7rem;color:rgba(255,255,255,.5);font-family:'Inter',sans-serif;}
.header-actions{display:flex;gap:8px;align-items:center;}
.hdr-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#fff;padding:5px 10px;font-size:.78rem;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:background .2s;}
.hdr-btn:hover{background:rgba(255,255,255,.18);}

/* search box in header */
#globalSearch{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  border-radius:6px;color:#fff;padding:5px 12px;font-size:.9rem;
  font-family:'Noto Serif Bengali',serif;outline:none;width:180px;
  transition:border-color .2s,width .2s;
}
#globalSearch:focus{border-color:var(--gold-light);width:220px;}
#globalSearch::placeholder{color:rgba(255,255,255,.4);}

/* ===== SIDEBAR ===== */
#sidebar{
  position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--sidebar-w);
  background:var(--surface);border-right:1px solid var(--border);
  overflow-y:auto;z-index:150;transition:transform .3s;
}
#sidebar.closed{transform:translateX(calc(-1 * var(--sidebar-w)));}
.sidebar-head{
  padding:12px 14px;background:var(--surface2);
  border-bottom:1px solid var(--border);
  font-size:.78rem;font-family:'Inter',sans-serif;
  color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;
}
.surah-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.surah-item:hover{background:var(--gold-pale);}
.surah-item.active{background:var(--green-pale);border-left:3px solid var(--green);}
.surah-num{
  width:28px;height:28px;border-radius:50%;
  background:var(--gold-pale);border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:600;color:var(--gold);
  flex:0 0 auto;font-family:'Inter',sans-serif;
}
.surah-item.active .surah-num{background:var(--green-pale);border-color:var(--green);color:var(--green);}
.surah-info{flex:1;min-width:0;}
.surah-name-bn{font-size:.88rem;font-weight:600;color:var(--ink);}
.surah-name-ar{font-family:'Amiri Quran',serif;font-size:1rem;direction:rtl;color:var(--gold);line-height:1.2;}
.surah-meta{font-size:.7rem;color:var(--muted);font-family:'Inter',sans-serif;margin-top:2px;}

/* ===== MAIN CONTENT ===== */
#main{
  margin-left:var(--sidebar-w);margin-top:var(--header-h);
  padding:24px 20px 60px;max-width:860px;
  transition:margin-left .3s;
}
#main.full{margin-left:0;}

/* ===== SURAH HEADER ===== */
.surah-header{
  background:linear-gradient(135deg,#1a1000,#2d2200,#0a1a0a);
  color:#fff;border-radius:12px;padding:24px;margin-bottom:20px;
  text-align:center;
}
.surah-header .ar-name{
  font-family:'Amiri Quran',serif;font-size:3rem;direction:rtl;
  color:var(--gold-light);margin-bottom:8px;line-height:1.3;
}
.surah-header .bn-name{font-size:1.3rem;font-weight:700;margin-bottom:4px;}
.surah-header .sub-info{
  font-size:.8rem;color:rgba(255,255,255,.6);
  font-family:'Inter',sans-serif;margin-top:6px;
}
.surah-header .badge{
  display:inline-block;padding:3px 10px;border-radius:12px;
  font-size:.72rem;font-family:'Inter',sans-serif;margin:0 3px;
}
.badge-mec{background:rgba(181,136,42,.25);color:var(--gold-light);border:1px solid rgba(181,136,42,.4);}
.badge-med{background:rgba(42,122,80,.25);color:#6dd4a0;border:1px solid rgba(42,122,80,.4);}

/* Surah preface */
.preface-box{
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gold);
  border-radius:8px;padding:16px 18px;margin-bottom:20px;
  font-size:.9rem;line-height:1.9;
}
.preface-label{
  font-size:.7rem;font-family:'Inter',sans-serif;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;
}

/* Bismillah */
.bismillah{
  text-align:center;font-family:'Amiri Quran',serif;font-size:2rem;
  direction:rtl;color:var(--ink);padding:16px;
  border-bottom:1px solid var(--border);margin-bottom:20px;
}

/* ===== AYAH CARD ===== */
.ayah-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;margin-bottom:14px;overflow:hidden;
  transition:box-shadow .2s;
}
.ayah-card:hover{box-shadow:0 3px 16px rgba(0,0,0,.1);}

.ayah-number-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);
}
.ayah-num-badge{
  display:flex;align-items:center;gap:6px;
  font-family:'Inter',sans-serif;font-size:.75rem;color:var(--muted);
}
.ayah-num-circle{
  width:26px;height:26px;border-radius:50%;
  background:var(--gold-pale);border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:700;color:var(--gold);
}
.ayah-actions{display:flex;gap:6px;}
.ayah-act-btn{
  background:none;border:none;cursor:pointer;
  font-size:.9rem;padding:2px 5px;border-radius:4px;
  color:var(--muted);transition:color .15s,background .15s;
}
.ayah-act-btn:hover{color:var(--gold);background:var(--gold-pale);}
.ayah-act-btn.fav-on{color:#e8a020;}

/* Arabic text */
.ayah-arabic{
  font-family:'Amiri Quran',serif;font-size:1.8rem;
  direction:rtl;text-align:right;line-height:2.2;
  padding:18px 18px 10px;color:var(--ink);
}

/* Translation */
.ayah-translate{
  padding:10px 18px 12px;
  font-size:.93rem;line-height:1.9;
  color:var(--ink);border-top:1px dashed var(--border);
}
.trans-label{
  font-size:.68rem;font-family:'Inter',sans-serif;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--green);margin-bottom:4px;
}

/* Tafseer */
.ayah-tafseer{
  padding:12px 18px 14px;
  font-size:.88rem;line-height:2;
  border-top:1px solid var(--border);
  background:var(--surface2);
  display:none;
}
.ayah-tafseer.open{display:block;}
.tafseer-label{
  font-size:.68rem;font-family:'Inter',sans-serif;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;
}
.ayah-tafseer b{color:var(--red);}
.tafseer-toggle{
  display:flex;align-items:center;gap:6px;
  padding:8px 18px;border-top:1px solid var(--border);
  background:none;border-left:none;border-right:none;border-bottom:none;
  width:100%;text-align:left;cursor:pointer;
  font-size:.8rem;color:var(--gold);font-family:'Noto Serif Bengali',serif;
  transition:background .15s;
}
.tafseer-toggle:hover{background:var(--gold-pale);}
.toggle-icon{transition:transform .2s;font-size:.7rem;}
.tafseer-toggle.open .toggle-icon{transform:rotate(180deg);}

/* ===== SEARCH RESULTS ===== */
.search-result-item{
  padding:12px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.search-result-item:hover{background:var(--gold-pale);}
.sr-ref{font-size:.75rem;color:var(--gold);font-family:'Inter',sans-serif;margin-bottom:4px;}
.sr-arabic{font-family:'Amiri Quran',serif;font-size:1.2rem;direction:rtl;text-align:right;margin-bottom:4px;}
.sr-trans{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
mark{background:rgba(181,136,42,.25);color:var(--ink);border-radius:2px;padding:0 2px;}

/* ===== INTRO PAGE ===== */
.intro-page{padding:4px 0;}
.intro-page h{display:block;font-weight:700;font-size:1.05rem;margin:16px 0 6px;color:var(--green);}
.intro-content{font-size:.92rem;line-height:2;white-space:pre-wrap;}

/* ===== JUZ NAV ===== */
.juz-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;}
.juz-tab{
  padding:4px 10px;border-radius:16px;border:1px solid var(--border);
  background:var(--surface);font-size:.75rem;font-family:'Inter',sans-serif;
  cursor:pointer;transition:all .15s;color:var(--muted);
}
.juz-tab:hover{border-color:var(--gold);color:var(--gold);}
.juz-tab.active{background:var(--gold);border-color:var(--gold);color:#fff;}

/* ===== FONT SIZE ===== */
.fs-ctrl{display:flex;align-items:center;gap:4px;}
.fs-btn{
  width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.1);color:#fff;cursor:pointer;
  font-size:.85rem;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.fs-btn:hover{background:rgba(255,255,255,.2);}

/* ===== LOADING ===== */
.loading{text-align:center;padding:80px 20px;}
.spinner{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== OVERLAY ===== */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:140;}
#overlay.show{display:block;}

/* ===== RESPONSIVE ===== */
@media(max-width:700px){
  :root{--sidebar-w:260px;}
  #sidebar{transform:translateX(calc(-1 * var(--sidebar-w)));}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #globalSearch{width:130px;}
  #globalSearch:focus{width:150px;}
  .ayah-arabic{font-size:1.5rem;}
}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <button id="menuBtn" title="মেনু">☰</button>
  <div class="header-title">
    <h1>তাফসীরে উসমানী</h1>
    <p id="currentRef">সূরা নির্বাচন করুন</p>
  </div>
  <div class="header-actions">
    <div class="fs-ctrl">
      <button class="fs-btn" id="fsDown">A−</button>
      <button class="fs-btn" id="fsUp">A+</button>
    </div>
    <input type="search" id="globalSearch" placeholder="🔍 খুঁজুন…" autocomplete="off">
    <button class="hdr-btn" id="darkBtn">🌙</button>
  </div>
</div>

<!-- SIDEBAR -->
<div id="overlay"></div>
<div id="sidebar" class="closed">
  <div class="sidebar-head">
    <span>১১৪ সূরা</span>
    <span id="sidebarJuzInfo"></span>
  </div>
  <div id="surahList"></div>
</div>

<!-- MAIN -->
<div id="main" class="full">
  <div class="loading">
    <div class="spinner"></div>
    <p style="font-family:'Amiri Quran',serif;font-size:1.5rem;direction:rtl;color:var(--gold);margin-bottom:8px;">بِسْمِ ٱللَّهِ</p>
    <p>তাফসীরে উসমানী লোড হচ্ছে…</p>
  </div>
</div>

<script>
// ======================================================
// STATE
// ======================================================
let DATA = null;
let currentSurah = null;
let favorites = JSON.parse(localStorage.getItem('tafsir_favs') || '{}');
let arabicFontSize = parseFloat(localStorage.getItem('tafsir_fs') || '1.8');
let sidebarOpen = false;
let searchTimer;

// ======================================================
// DARK MODE
// ======================================================
function applyDark(on) {
  document.body.classList.toggle('dark', on);
  document.getElementById('darkBtn').textContent = on ? '☀' : '🌙';
  localStorage.setItem('tafsir_dark', on ? '1' : '0');
}
document.getElementById('darkBtn').addEventListener('click', () => {
  applyDark(!document.body.classList.contains('dark'));
});
if (localStorage.getItem('tafsir_dark') === '1') applyDark(true);

// ======================================================
// FONT SIZE
// ======================================================
function applyFontSize() {
  document.querySelectorAll('.ayah-arabic').forEach(el => {
    el.style.fontSize = arabicFontSize + 'rem';
  });
  localStorage.setItem('tafsir_fs', arabicFontSize);
}
document.getElementById('fsUp').addEventListener('click', () => {
  arabicFontSize = Math.min(3.5, arabicFontSize + 0.15);
  applyFontSize();
});
document.getElementById('fsDown').addEventListener('click', () => {
  arabicFontSize = Math.max(1.0, arabicFontSize - 0.15);
  applyFontSize();
});

// ======================================================
// SIDEBAR
// ======================================================
function toggleSidebar(force) {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const main = document.getElementById('main');
  const isMobile = window.innerWidth <= 700;

  if (force !== undefined) sidebarOpen = force;
  else sidebarOpen = !sidebarOpen;

  if (sidebarOpen) {
    sidebar.classList.remove('closed');
    if (isMobile) {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    } else {
      main.classList.remove('full');
    }
  } else {
    sidebar.classList.add('closed');
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
    main.classList.add('full');
  }
}

document.getElementById('menuBtn').addEventListener('click', () => toggleSidebar());
document.getElementById('overlay').addEventListener('click', () => toggleSidebar(false));

// ======================================================
// FAVORITES
// ======================================================
function favKey(sura, ayah) { return `${sura}:${ayah}`; }
function isFav(sura, ayah) { return !!favorites[favKey(sura, ayah)]; }
function toggleFavAyah(sura, ayah) {
  const k = favKey(sura, ayah);
  if (favorites[k]) delete favorites[k];
  else favorites[k] = 1;
  localStorage.setItem('tafsir_favs', JSON.stringify(favorites));
}

// ======================================================
// HELPERS
// ======================================================
function getSurah(no) {
  return DATA.surahs.find(s => parseInt(s.no) === parseInt(no));
}
function getAyahsForSurah(no) {
  return DATA.ayahs.filter(a => a[1] === parseInt(no));
}

function highlight(text, query) {
  if (!query || !text) return text || '';
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
}

// ======================================================
// BUILD SIDEBAR
// ======================================================
function buildSidebar() {
  const list = document.getElementById('surahList');
  list.innerHTML = '';
  DATA.surahs.forEach(s => {
    const div = document.createElement('div');
    div.className = 'surah-item';
    div.dataset.no = s.no;
    div.innerHTML = `
      <div class="surah-num">${s.no_bn || s.no}</div>
      <div class="surah-info">
        <div class="surah-name-ar">${s.name_ar}</div>
        <div class="surah-name-bn">${s.name_bn}</div>
        <div class="surah-meta">${s.ayah_count} আয়াত · ${s.type === 'Meccan' ? 'মক্কী' : 'মাদানী'}</div>
      </div>
    `;
    div.addEventListener('click', () => {
      loadSurah(parseInt(s.no));
      if (window.innerWidth <= 700) toggleSidebar(false);
    });
    list.appendChild(div);
  });
}

// ======================================================
// LOAD SURAH
// ======================================================
function loadSurah(no) {
  currentSurah = no;
  const surah = getSurah(no);
  if (!surah) return;

  // sidebar active
  document.querySelectorAll('.surah-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.no) === no);
  });

  document.getElementById('currentRef').textContent =
    `সূরা ${surah.name_bn} (${surah.no_bn || surah.no})`;

  const ayahs = getAyahsForSurah(no);
  const main = document.getElementById('main');

  let html = '';

  // Surah header
  const typeLabel = surah.type === 'Meccan' ? 'মক্কী' : 'মাদানী';
  const typeBadge = surah.type === 'Meccan' ? 'badge-mec' : 'badge-med';
  html += `
    <div class="surah-header">
      <div class="ar-name">${surah.name_ar}</div>
      <div class="bn-name">${surah.name_bn}</div>
      <div style="font-size:.88rem;color:rgba(255,255,255,.7);margin:4px 0">${surah.meaning_bn}</div>
      <div class="sub-info">
        <span class="badge ${typeBadge}">${typeLabel}</span>
        <span class="badge badge-mec">আয়াত: ${surah.ayah_count}</span>
        <span class="badge badge-med">রুকু: ${surah.ruku || ''}</span>
        <span class="badge badge-mec">পৃষ্ঠা: ${surah.page}</span>
      </div>
    </div>`;

  // Preface
  if (surah.preface) {
    html += `
      <div class="preface-box">
        <div class="preface-label">সূরার ভূমিকা</div>
        ${surah.preface.replace(/<h>/g,'<b style="display:block;margin:8px 0 4px;color:var(--green)">').replace(/<\/h>/g,'</b>')}
      </div>`;
  }

  // Bismillah (except Tawbah = surah 9)
  if (parseInt(surah.no) !== 9) {
    html += `<div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
  }

  // Ayahs
  ayahs.forEach(a => {
    const [id, sura_no, ayah_no, juz, arabic, trans, tafseer] = a;
    const favActive = isFav(sura_no, ayah_no) ? 'fav-on' : '';
    const hasTafseer = tafseer && tafseer.trim();

    html += `
      <div class="ayah-card" id="ayah-${sura_no}-${ayah_no}">
        <div class="ayah-number-bar">
          <div class="ayah-num-badge">
            <div class="ayah-num-circle">${ayah_no}</div>
            <span>সূরা ${surah.name_bn} · আয়াত ${ayah_no} · জুয ${juz}</span>
          </div>
          <div class="ayah-actions">
            <button class="ayah-act-btn ${favActive}" onclick="handleFav(${sura_no},${ayah_no},this)" title="ফেভারিট">★</button>
            <button class="ayah-act-btn" onclick="copyAyah(${id})" title="কপি">📋</button>
          </div>
        </div>
        <div class="ayah-arabic" style="font-size:${arabicFontSize}rem">${arabic || ''}</div>
        <div class="ayah-translate">
          <div class="trans-label">বাংলা অনুবাদ</div>
          ${trans || ''}
        </div>
        ${hasTafseer ? `
        <button class="tafseer-toggle" onclick="toggleTafseer(this)">
          <span class="toggle-icon">▾</span> তাফসীর দেখুন
        </button>
        <div class="ayah-tafseer">
          <div class="tafseer-label">তাফসীরে উসমানী</div>
          ${tafseer.replace(/<h>/g,'<b style="display:block;margin:8px 0 4px;color:var(--green)">').replace(/<\/h>/g,'</b>')}
        </div>` : ''}
      </div>`;
  });

  main.innerHTML = html;
  window.scrollTo({ top: 0 });
}

function toggleTafseer(btn) {
  const tafseer = btn.nextElementSibling;
  tafseer.classList.toggle('open');
  btn.classList.toggle('open');
  btn.querySelector('.toggle-icon').textContent = tafseer.classList.contains('open') ? '▴' : '▾';
  btn.childNodes[1].textContent = tafseer.classList.contains('open') ? ' তাফসীর লুকান' : ' তাফসীর দেখুন';
}

function handleFav(sura, ayah, btn) {
  toggleFavAyah(sura, ayah);
  btn.classList.toggle('fav-on', isFav(sura, ayah));
}

function copyAyah(id) {
  const ayah = DATA.ayahs.find(a => a[0] === id);
  if (!ayah) return;
  const text = `${ayah[4]}\n${ayah[5] || ''}`;
  navigator.clipboard.writeText(text).then(() => {
    showToast('কপি হয়েছে!');
  });
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:.82rem;z-index:999;font-family:Inter,sans-serif;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2000);
}

// ======================================================
// SEARCH
// ======================================================
document.getElementById('globalSearch').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) {
    if (currentSurah) loadSurah(currentSurah);
    else showWelcome();
    return;
  }
  searchTimer = setTimeout(() => doSearch(q), 250);
});

function doSearch(q) {
  const ql = q.toLowerCase();
  const results = DATA.ayahs.filter(a => {
    return (a[4] && a[4].includes(q)) ||
           (a[5] && a[5].toLowerCase().includes(ql)) ||
           (a[6] && a[6].toLowerCase().includes(ql));
  }).slice(0, 100);

  const main = document.getElementById('main');
  document.getElementById('currentRef').textContent = `"${q}" — ${results.length} ফলাফল`;

  if (results.length === 0) {
    main.innerHTML = `<div style="text-align:center;padding:60px;color:var(--muted)">কোনো ফলাফল পাওয়া যায়নি</div>`;
    return;
  }

  let html = `<div style="font-size:.82rem;color:var(--muted);margin-bottom:12px;font-family:'Inter',sans-serif;">${results.length}টি আয়াতে পাওয়া গেছে</div>`;
  results.forEach(a => {
    const surah = getSurah(a[1]);
    const trans = highlight((a[5] || '').slice(0, 120), q);
    html += `
      <div class="search-result-item" onclick="gotoAyah(${a[1]},${a[2]})">
        <div class="sr-ref">সূরা ${surah?.name_bn || a[1]} · আয়াত ${a[2]} · জুয ${a[3]}</div>
        <div class="sr-arabic">${a[4] || ''}</div>
        <div class="sr-trans">${trans}${(a[5]||'').length > 120 ? '…' : ''}</div>
      </div>`;
  });

  main.innerHTML = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden">${html}</div>`;
}

function gotoAyah(sura, ayah) {
  document.getElementById('globalSearch').value = '';
  loadSurah(sura);
  setTimeout(() => {
    const el = document.getElementById(`ayah-${sura}-${ayah}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 300);
}

// ======================================================
// WELCOME / INTRO
// ======================================================
function showWelcome() {
  const main = document.getElementById('main');
  const intro = DATA.intros[0];
  let html = `
    <div style="text-align:center;padding:30px 20px 20px;">
      <div style="font-family:'Amiri Quran',serif;font-size:3rem;direction:rtl;color:var(--gold);margin-bottom:8px;">تفسير عثماني</div>
      <h2 style="font-size:1.3rem;margin-bottom:6px;">তাফসীরে উসমানী</h2>
      <p style="color:var(--muted);font-size:.88rem;">শাইখুল ইসলাম মাওলানা শাব্বীর আহমাদ উসমানী রহ.</p>
      <p style="color:var(--muted);font-size:.8rem;margin-top:4px;">১১৪ সূরা · ৬,২৩৬ আয়াত · বাংলা অনুবাদ ও তাফসীর</p>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:12px;">`;

  DATA.intros.forEach(intro => {
    html += `
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);">
        <div style="font-size:.7rem;color:var(--gold);font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">ভূমিকা</div>
        <div style="font-weight:600;margin-bottom:8px;">${intro.title}</div>
        <div style="font-size:.85rem;line-height:2;color:var(--muted);white-space:pre-wrap;">${(intro.content||'').slice(0,300)}${(intro.content||'').length > 300 ? '…' : ''}</div>
      </div>`;
  });

  html += `</div>
    <div style="text-align:center;margin-top:20px;color:var(--muted);font-size:.8rem;font-family:'Inter',sans-serif;">
      বাম দিকের মেনু থেকে সূরা নির্বাচন করুন
    </div>`;

  main.innerHTML = html;
}

// ======================================================
// LOAD DATA
// ======================================================
async function loadData() {
  try {
    const resp = await fetch('tafsir_data.json');
    if (!resp.ok) throw new Error('fetch failed');
    DATA = await resp.json();

    buildSidebar();
    showWelcome();
    toggleSidebar(true);

  } catch (err) {
    document.getElementById('main').innerHTML = `
      <div style="text-align:center;padding:60px;color:var(--muted)">
        <p style="font-size:1.2rem;margin-bottom:8px;">⚠ ডেটা লোড ব্যর্থ</p>
        <p>tafsir_data.json ফাইলটি একই ফোল্ডারে আছে কিনা নিশ্চিত করুন।</p>
      </div>`;
  }
}

loadData();
</script>
